<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabrication Story</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Roboto+Slab:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        h1, h2, h3 { font-family: 'Roboto Slab', serif; }
        .loader { border-top-color: #ea580c; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="text-slate-800">

    <nav class="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-50 shadow-sm">
        <div class="max-w-4xl mx-auto flex items-center gap-3">
            <div class="bg-orange-600 text-white p-2 rounded-lg shadow-md">
                <i class="fa-solid fa-hammer text-lg"></i>
            </div>
            <h1 class="text-xl tracking-tight text-slate-900">Fabrication<span class="text-orange-600">Story</span></h1>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-6 space-y-8">
        
        <div id="step1" class="bg-white p-8 rounded-xl shadow-sm border border-slate-100">
            <h2 class="text-lg font-bold text-slate-900 mb-4">1. Upload Photos</h2>
            
            <div class="border-2 border-dashed border-slate-300 rounded-lg p-8 text-center hover:bg-slate-50 transition cursor-pointer relative group">
                <input type="file" id="imageInput" multiple accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                <i class="fa-solid fa-camera text-3xl text-slate-300 mb-3 group-hover:text-orange-500"></i>
                <p class="text-sm text-slate-500 font-medium">Tap to select build photos</p>
            </div>

            <div id="imagePreview" class="grid grid-cols-3 gap-3 mt-4"></div>

            <button onclick="analyzeImages()" id="analyzeBtn" class="hidden w-full mt-6 bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 px-6 rounded-lg transition shadow-lg">
                Analyze Construction <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>

            <div id="loading1" class="hidden mt-6 text-center">
                <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-8 w-8 mb-2 mx-auto"></div>
                <p class="text-sm text-slate-500">Scanning geometry & materials...</p>
            </div>
        </div>

        <div id="step2" class="hidden bg-white p-8 rounded-xl shadow-sm border border-slate-100">
            <h2 class="text-lg font-bold text-slate-900 mb-1">2. Pick an Angle</h2>
            <p class="text-sm text-slate-500 mb-6">What's the most interesting part of this build?</p>
            
            <div id="questionsList" class="space-y-3"></div>

            <div id="answerSection" class="hidden mt-6 pt-6 border-t border-slate-100">
                <label class="block text-sm font-bold text-slate-900 mb-2">Add a few details</label>
                <textarea id="userAnswer" rows="3" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-orange-500 text-sm" placeholder="e.g. We used a hidden aluminum subframe to support the weight..."></textarea>
                
                <button onclick="generatePost()" class="w-full mt-4 bg-orange-600 hover:bg-orange-700 text-white font-bold py-4 px-6 rounded-lg transition shadow-lg">
                    Generate Post <i class="fa-solid fa-wand-magic-sparkles ml-2"></i>
                </button>

                <div id="loading2" class="hidden mt-4 text-center">
                    <div class="loader ease-linear rounded-full border-4 border-t-4 border-slate-200 h-8 w-8 mb-2 mx-auto"></div>
                    <p class="text-sm text-slate-500">Drafting post...</p>
                </div>
            </div>
        </div>

        <div id="step3" class="hidden bg-white p-8 rounded-xl shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg font-bold text-slate-900">Your Draft</h2>
                <button onclick="location.reload()" class="text-sm text-slate-400 hover:text-slate-600">Start Over</button>
            </div>
            
            <div class="bg-slate-50 p-6 rounded-xl border border-slate-200">
                <div id="finalPost" class="prose prose-slate max-w-none text-slate-700 whitespace-pre-wrap font-medium leading-relaxed"></div>
            </div>
            
            <button onclick="copyToClipboard()" class="w-full mt-6 bg-slate-900 hover:bg-slate-800 text-white font-bold py-4 px-6 rounded-lg transition shadow-lg">
                Copy to Clipboard
            </button>
        </div>

    </main>

    <script>
        let selectedQuestion = "";
        let uploadedImages = [];

        // 1. Handle Upload
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            const preview = document.getElementById('imagePreview');
            preview.innerHTML = '';
            uploadedImages = [];
            
            if(files.length > 0) document.getElementById('analyzeBtn').classList.remove('hidden');

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    uploadedImages.push(e.target.result);
                    const img = document.createElement('img');
                    img.src = e.target.result;
                    img.className = 'w-full h-24 object-cover rounded-lg border border-slate-200';
                    preview.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        });

        // 2. Analyze Images
        async function analyzeImages() {
            document.getElementById('analyzeBtn').classList.add('hidden');
            document.getElementById('loading1').classList.remove('hidden');
            
            try {
                const response = await fetch('/api/analyze-images', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ images: uploadedImages })
                });
                const data = await response.json();
                renderQuestions(data.questions);
                
                document.getElementById('loading1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
                document.getElementById('step2').scrollIntoView({ behavior: 'smooth' });
            } catch (err) {
                alert("Error analyzing images. Check console.");
                document.getElementById('analyzeBtn').classList.remove('hidden');
                document.getElementById('loading1').classList.add('hidden');
            }
        }

        function renderQuestions(questions) {
            const container = document.getElementById('questionsList');
            container.innerHTML = '';
            questions.forEach(q => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-4 rounded-xl border border-slate-200 hover:border-orange-500 hover:bg-orange-50 transition bg-white shadow-sm group';
                btn.onclick = () => selectQuestion(q.text, btn);
                btn.innerHTML = `
                    <span class="text-xs font-bold text-orange-600 uppercase tracking-wider mb-1 block">${q.category}</span>
                    <span class="text-slate-700 font-medium group-hover:text-slate-900">${q.text}</span>
                `;
                container.appendChild(btn);
            });
        }

        function selectQuestion(text, element) {
            selectedQuestion = text;
            const allBtns = document.getElementById('questionsList').children;
            Array.from(allBtns).forEach(b => {
                b.classList.remove('ring-2', 'ring-orange-500', 'bg-orange-50', 'border-orange-500');
                b.classList.add('border-slate-200', 'bg-white');
            });
            element.classList.remove('border-slate-200', 'bg-white');
            element.classList.add('ring-2', 'ring-orange-500', 'bg-orange-50', 'border-orange-500');
            
            const section = document.getElementById('answerSection');
            section.classList.remove('hidden');
            section.scrollIntoView({ behavior: 'smooth' });
            document.getElementById('userAnswer').focus();
        }

        // 3. Generate Post
        async function generatePost() {
            const answer = document.getElementById('userAnswer').value;
            if(!answer) return alert("Please add a short note first.");

            document.getElementById('loading2').classList.remove('hidden');
            
            try {
                const response = await fetch('/api/generate-post', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: selectedQuestion, answer })
                });
                const data = await response.json();
                document.getElementById('finalPost').innerText = data.post;
                
                document.getElementById('loading2').classList.add('hidden');
                document.getElementById('step2').classList.add('hidden'); // Hide previous step
                document.getElementById('step3').classList.remove('hidden');
            } catch (err) {
                alert("Error generating post");
                document.getElementById('loading2').classList.add('hidden');
            }
        }

        function copyToClipboard() {
            const text = document.getElementById('finalPost').innerText;
            navigator.clipboard.writeText(text);
            alert("Copied to clipboard!");
        }
    </script>
</body>
</html>
